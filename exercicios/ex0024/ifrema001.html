<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body>
    <h1>Aprendendo a usar ifremas</h1>

<!--Por padrão é de 300width x 150height-->

    <p>
        ifremas na pratica <iframe src="https://www.cursoemvideo.com/" frameborder="0"  height="500px" width="500px">
    </iframe>
    com o canal
         <a  href="https://www.cursoemvideo.com/" target="_blank">
            curso emvideo
        </a>
    </p>
    <p>
        o site do 

        <iframe src="https://www.google.com.br/?hl=pt-BR" frameborder="0" height="400px" width="600px">
           <!-- [Esse dispositivo não é compativel com isso.] 

            Ou usar um link para o usúario acessar o site usado.
            -->

            <a  href="https://www.google.com.br/?hl=pt-BR">
            </a>
        </iframe>

        também é muito legal, pena que não funciona dentro do iframe
    </p>

    <p>
        o repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="700px" width="500px">
            <a href="https://gustavoguanabara.github.io"></a>
        </iframe>

        também é muito legal, funciona o uso do iframe 
    </p>

</body>
